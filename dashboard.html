<!DOCTYPE html>
<html>
<head>
    <title>IoT Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body style="font-family: Arial; text-align:center; background:#0f172a; color:white;">

    <h1>🔥 IoT Temperature Dashboard</h1>

    <canvas id="chart" width="600" height="300"></canvas>

    <script>
        const ctx = document.getElementById('chart').getContext('2d');

        let chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Temperature',
                    data: [],
                    borderWidth: 2
                }]
            }
        });

        async function fetchData() {
            let res = await fetch("http://127.0.0.1:8000/data");
            let data = await res.json();

            let lastData = data.slice(-10);

            chart.data.labels = lastData.map((_, i) => i + 1);
            chart.data.datasets[0].data = lastData.map(d => d.temperature);

            chart.update();
        }

        setInterval(fetchData, 2000);
    </script>

</body>
</html>
